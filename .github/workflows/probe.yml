name: Probe
on:
  push:
    paths: ["debug_probe.py"]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt && python debug_probe.py && cat probe.json
      - uses: actions/upload-artifact@v4
        with: {name: probe, path: probe.json}
